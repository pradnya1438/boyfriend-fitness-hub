name: Hourly Routine Check

on:
  schedule:
    # This automatically wakes up and triggers the script every hour on the dot
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime for testing

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v3

      - name: Setup Python environment
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Network Libraries
        run: |
          pip install pandas requests

      - name: Run Reminder System
        run: python remind_v2.py

